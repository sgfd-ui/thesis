  <rect x="1608" y="115" width="280" height="265" class="box" fill="#f1cfbd"/>
  <text x="1748" y="178" text-anchor="middle" class="title">头部锁定</text>
  <text x="1748" y="216" text-anchor="middle" class="sub">减少头部候选抖动</text>
  <rect x="1680" y="246" width="136" height="28" fill="#eea287" stroke="#777" stroke-width="1.4"/>
  <rect x="1708" y="292" width="80" height="64" fill="#ffffff" stroke="#777" stroke-width="3"/>
  <line x1="1694" y1="274" x2="1694" y2="292" stroke="#777" stroke-width="3"/>
  <line x1="1802" y1="274" x2="1802" y2="292" stroke="#777" stroke-width="3"/>

  <rect x="1970" y="135" width="105" height="225" class="box" fill="#ffffff"/>
  <text x="2022.5" y="198" text-anchor="middle" class="title">输出</text>
  <text x="2022.5" y="232" text-anchor="middle" class="small">H<tspan baseline-shift="sub" font-size="13">R</tspan>, H<tspan baseline-shift="sub" font-size="13">S</tspan></text>
  <rect x="1985" y="252" width="37" height="34" fill="#eea287" stroke="#8a8a8a" stroke-width="1.2"/>
  <rect x="2029" y="252" width="37" height="34" fill="#f3cfbf" stroke="#8a8a8a" stroke-width="1.2"/>
  <rect x="1985" y="297" width="37" height="34" fill="#c8daeb" stroke="#8a8a8a" stroke-width="1.2"/>
  <rect x="2029" y="297" width="37" height="34" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="2003.5" y="275" text-anchor="middle" class="label">HH</text>
  <text x="2047.5" y="275" text-anchor="middle" class="label">HC</text>
  <text x="2003.5" y="320" text-anchor="middle" class="label">CH</text>
  <text x="2047.5" y="320" text-anchor="middle" class="label">CC</text>

  <line x1="283" y1="247" x2="388" y2="247" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="668" y1="247" x2="778" y2="247" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1088" y1="247" x2="1198" y2="247" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1498" y1="247" x2="1608" y2="247" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1888" y1="247" x2="1970" y2="247" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
