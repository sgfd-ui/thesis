<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 34px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #16324f; }
      .subtitle { font: 500 20px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #4f6475; }
      .label { font: 600 24px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #18354d; }
      .small { font: 500 19px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #28475f; }
      .tiny { font: 500 17px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #3e5568; }
      .boxBlue { fill: #e9f3ff; stroke: #2a6fbb; stroke-width: 3; rx: 24; ry: 24; }
      .boxGreen { fill: #ebf8ef; stroke: #2d8a57; stroke-width: 3; rx: 24; ry: 24; }
      .boxOrange { fill: #fff3e8; stroke: #d17b23; stroke-width: 3; rx: 24; ry: 24; }
      .boxGray { fill: #f4f7fa; stroke: #6b7f90; stroke-width: 3; rx: 24; ry: 24; }
      .pill { fill: #ffffff; stroke: #9fb8cb; stroke-width: 2; rx: 16; ry: 16; }
      .arrowBlue { stroke: #2a6fbb; stroke-width: 4; fill: none; marker-end: url(#arrowBlue); }
      .arrowGreen { stroke: #2d8a57; stroke-width: 4; fill: none; marker-end: url(#arrowGreen); }
      .arrowOrange { stroke: #d17b23; stroke-width: 4; fill: none; marker-end: url(#arrowOrange); }
      .arrowGray { stroke: #6b7f90; stroke-width: 3; fill: none; marker-end: url(#arrowGray); stroke-dasharray: 10 8; }
      .frame { fill: #fbfdff; stroke: #c8d8e6; stroke-width: 2.5; rx: 28; ry: 28; }
    </style>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2a6fbb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2d8a57"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#d17b23"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#6b7f90"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1560" height="860" class="frame"/>
  <text x="70" y="85" class="title">图 5  面向 RDMA 的快照驱动运行时再平衡总体流程</text>
  <text x="70" y="120" class="subtitle">本地顺序执行、单次拉取、CAS 抢占、按需刷新与双缓冲发布形成闭环</text>

  <rect x="70" y="180" width="360" height="210" class="boxGreen"/>
  <text x="100" y="230" class="label">Victim / Busy Worker</text>
  <text x="100" y="275" class="small">本地线程顺序推进 Head_i</text>
  <text x="100" y="310" class="small">尾部 Tail_i 可被远端 thief 竞争</text>
  <rect x="105" y="330" width="290" height="36" class="pill"/>
  <text x="122" y="355" class="tiny">区间状态: [Head_i, Tail_i)</text>

  <rect x="70" y="490" width="360" height="220" class="boxBlue"/>
  <text x="100" y="540" class="label">Thief / Idle Worker</text>
  <text x="100" y="585" class="small">本地工作耗尽后转入 stealing</text>
  <text x="100" y="620" class="small">执行 one-shot pull 获取全局快照</text>
  <text x="100" y="655" class="small">依据 JFI 截断候选池并计算窃取量</text>

  <rect x="560" y="210" width="470" height="500" class="boxGray"/>
  <text x="595" y="260" class="label">Shared Blackboard</text>
  <rect x="610" y="295" width="360" height="42" class="pill"/>
  <text x="635" y="322" class="small">Visible_View_Version</text>
  <rect x="610" y="355" width="360" height="42" class="pill"/>
  <text x="635" y="382" class="small">Active_Slot</text>
  <rect x="610" y="415" width="360" height="42" class="pill"/>
  <text x="635" y="442" class="small">Current_JFI</text>
  <rect x="610" y="475" width="360" height="42" class="pill"/>
  <text x="635" y="502" class="small">Refresh_Lock</text>
  <rect x="610" y="545" width="160" height="110" class="boxBlue"/>
  <text x="640" y="590" class="small">Slot 0</text>
  <text x="628" y="626" class="tiny">visible / shadow</text>
  <rect x="810" y="545" width="160" height="110" class="boxOrange"/>
  <text x="840" y="590" class="small">Slot 1</text>
  <text x="828" y="626" class="tiny">visible / shadow</text>

  <rect x="1150" y="240" width="340" height="180" class="boxOrange"/>
  <text x="1182" y="290" class="label">Ephemeral Leader</text>
  <text x="1182" y="335" class="small">CAS 抢占 Refresh_Lock</text>
  <text x="1182" y="370" class="small">重算 JFI 并重排候选 victim</text>
  <text x="1182" y="405" class="small">写入 shadow slot 后统一发布</text>

  <rect x="1150" y="500" width="340" height="180" class="boxGreen"/>
  <text x="1182" y="550" class="label">Published Snapshot</text>
  <text x="1182" y="595" class="small">排序后的热点候选列表</text>
  <text x="1182" y="630" class="small">JFI, version, active slot</text>
  <text x="1182" y="665" class="small">供后续 thief 本地决策使用</text>

  <path d="M430 595 C495 595, 500 595, 560 595" class="arrowBlue"/>
  <text x="445" y="565" class="small">one-shot RDMA READ</text>

  <path d="M430 285 C500 285, 505 285, 560 315" class="arrowGray"/>
  <text x="430" y="250" class="small">Head_i / Tail_i 暴露到黑板</text>

  <path d="M1030 320 C1085 320, 1090 320, 1150 320" class="arrowOrange"/>
  <text x="1045" y="295" class="small">refresh trigger + CAS</text>

  <path d="M1320 420 C1320 455, 1320 460, 1320 500" class="arrowOrange"/>
  <text x="1340" y="468" class="small">双缓冲发布</text>

  <path d="M1150 590 C1080 590, 1080 590, 1030 590" class="arrowGreen"/>
  <text x="1035" y="562" class="small">最新快照对外可见</text>

  <path d="M1030 635 C1090 680, 1110 715, 1210 735" class="arrowGray"/>
  <text x="1100" y="705" class="small">版本推进后 thief 再次拉取</text>

  <path d="M950 545 C980 510, 1050 470, 1150 390" class="arrowGray"/>
  <text x="955" y="495" class="small">shadow slot 构建完成后翻转 Active_Slot</text>

  <path d="M430 650 C470 650, 500 650, 560 650" class="arrowBlue"/>
  <text x="442" y="682" class="small">JFI, K_pool, C_steal</text>

  <path d="M1030 655 C1090 655, 1110 655, 1150 620" class="arrowGreen"/>
  <text x="1050" y="685" class="small">候选 victim + version</text>

  <path d="M430 540 C500 500, 510 445, 560 440" class="arrowBlue"/>
  <text x="435" y="480" class="small">视图过期时触发刷新</text>

  <path d="M430 230 C500 210, 515 210, 560 240" class="arrowGreen"/>
  <text x="432" y="205" class="small">victim 按需暴露状态</text>

  <rect x="1180" y="740" width="270" height="92" class="pill"/>
  <text x="1210" y="776" class="small">闭环语义</text>
  <text x="1203" y="812" class="tiny">执行 -> 观察 -> 抢占 -> 刷新 -> 再发布</text>
</svg>
